project:
  type: website
  output-dir: docs
  post-render: scripts/clean-site-libs.R
  # Only site pages render. Repo docs (like the README) and the aplsr
  # package sources in apls-r/ are excluded from the website build.
  # apls-website-guide/ is a standalone Quarto book (the AP-LS Webeditor
  # Guide) and renders separately.
  render:
    - "*.qmd"
    - "!apls-r"
    - "!scripts"
    - "!apls-website-guide"
  resources:
    - "*.css"
    - "!conferences/_template"
    - "!apls-website-guide"
    - "*.pdf"
    - "about/imgs/"
    - "about/presidents/imgs/*"
    - "resources/newsletter/e-news/html/*"


website:
  title: "The American Psychology-Law Society"
  favicon: "assets/favicon_io/favicon.ico"
  search: true
  
  navbar:
    title: false
    logo: images/logo-light.png
    logo-alt: "American Psychology-Law Society home"
    right:
      - text: About
        menu:
          - text: About
            href: about/index.qmd
          - text: Leadership
            href: about/leadership.qmd
          - text: Committees
            href: about/committees.qmd
          - text: Statements
            href: about/statements.qmd
          - text: Community Standards
            href: about/standards.qmd
          - text: AP-LS Bylaws
            href: about/bylaws.qmd
          - text: Contact us
            href: about/contact.qmd
      - text: Publications
        menu:
          - text: AP-LS Newsletter
            href: newsletter/index.qmd
          - text: Publications
            href: publications/index.qmd
          - text: Law & Human Behavior
            href: https://www.apa.org/pubs/journals/lhb/
      - href: awards/index.qmd
        text: Awards
      - text: Conferences
        menu:
          - text: 2027 AP-LS Conference
            href: conferences/index.qmd
          - text: Preconference Workshops
            href: conferences/preconference/index.qmd
