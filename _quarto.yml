brand: _brand.yml


format:
  html:
    email-obfuscation: javascript
    link-external-newwindow: true
    anchor-sections: false
    theme:
      light: [default, theme.scss]
      dark:  [darkly, theme.scss]
    include-after-body: assets/a11y.html
    filters:
      - _filters/deadline-year.lua
      - panel-accordion

execute:
    freeze: auto
    

