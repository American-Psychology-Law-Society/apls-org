<script>
// Quarto generates some listing UI with heading levels that skip the page
// outline (h5 category labels, h5 card titles sitting under h2 sections).
// Styling on these elements is class-based, so swapping the tag does not
// change how anything looks. This runs once on page load.
document.addEventListener("DOMContentLoaded", function () {
  // Category sidebar label: it labels a filter control, not page structure.
  document.querySelectorAll("h5.quarto-listing-category-title").forEach(function (el) {
    var div = document.createElement("div");
    div.className = el.className;
    div.textContent = el.textContent;
    el.replaceWith(div);
  });

  // Listing card titles: keep them as real headings, but at a level that
  // follows the page outline (cards always live inside an h2 section).
  document.querySelectorAll("h5.card-title.listing-title").forEach(function (el) {
    var h3 = document.createElement("h3");
    h3.className = el.className;
    while (el.firstChild) h3.appendChild(el.firstChild);
    el.replaceWith(h3);
  });
});

// Widget accessibility fixes for client-rendered htmlwidgets. These run
// after the widgets mount, so a MutationObserver re-applies them whenever
// a reactable/crosstalk widget (re)draws.
(function () {
  function fixWidgets() {
    // reactable sets role="table" on .rt-table but gives its header/body
    // containers no rowgroup role, so rows are orphaned (axe
    // aria-required-children, serious). Add the missing roles.
    document.querySelectorAll(".rt-table .rt-thead:not([role]), .rt-table .rt-tbody:not([role])").forEach(function (el) {
      el.setAttribute("role", "rowgroup");
    });

    // reactable parks its aria-live status announcer INSIDE the
    // role="table" container, where a generic div is not an allowed child
    // (axe aria-required-children). Moving it out of the table keeps the
    // announcements working — a live region does not need to sit inside
    // the widget to be announced.
    document.querySelectorAll(".rt-table div[aria-live]").forEach(function (el) {
      var widget = el.closest(".ReactTable");
      if (widget && widget !== el.parentElement) widget.appendChild(el);
    });

    // reactable's search box is an unlabeled text input (axe label).
    document.querySelectorAll(".rt-search:not([aria-label])").forEach(function (el) {
      el.setAttribute("aria-label", "Search table");
    });

    // crosstalk filter dropdowns build selectize inputs without labels
    // (axe label). Name them from the filter group's visible label; the
    // stock crosstalk markup ships an empty <label>, so fall back to the
    // group id when it has no text.
    document.querySelectorAll(".selectize-input > input:not([data-a11y-done])").forEach(function (el) {
      var group = el.closest(".crosstalk-input") || el.closest("[id]");
      var label = group && group.querySelector("label");
      var text = label && label.textContent.trim();
      if (!text && group && group.id) text = "Filter by " + group.id.replace(/_/g, " ");
      el.setAttribute("aria-label", text || "Filter table");
      // Mark as handled: selectize re-creates its input on redraw, but the
      // :not() guard above keeps us from re-adding a label it already has.
      el.setAttribute("data-a11y-done", "1");
    });
  }

  var scheduled = false;
  var observer = new MutationObserver(function () {
    if (scheduled) return;
    scheduled = true;
    setTimeout(function () { scheduled = false; fixWidgets(); }, 150);
  });

  document.addEventListener("DOMContentLoaded", function () {
    fixWidgets();
    observer.observe(document.body, { childList: true, subtree: true });
  });
})();
</script>
